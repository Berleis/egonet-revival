name: Game Releases

on:
  pull_request:
    branches:
      - main
    paths:
      - "games/**"
      - "scripts/package-game-release.ps1"
      - ".github/workflows/game-releases.yml"
  push:
    branches:
      - main
    tags:
      - "dirt-showdown-v*"
    paths:
      - "games/**"
      - "scripts/package-game-release.ps1"
      - ".github/workflows/game-releases.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-dirt-showdown:
    name: Package DiRT Showdown
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Package
        shell: pwsh
        run: ./scripts/package-game-release.ps1 -Game dirt-showdown

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dirt-showdown-mod
          path: artifacts/releases/dirt-showdown/*

  release-dirt-showdown:
    name: Release DiRT Showdown
    runs-on: ubuntu-latest
    needs: package-dirt-showdown
    if: startsWith(github.ref, 'refs/tags/dirt-showdown-v')
    permissions:
      contents: write

    steps:
      - name: Download packaged release
        uses: actions/download-artifact@v4
        with:
          name: dirt-showdown-mod
          path: artifacts/releases/dirt-showdown

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/releases/dirt-showdown/* \
            --title "DiRT Showdown ${GITHUB_REF_NAME#dirt-showdown-}" \
            --notes-file artifacts/releases/dirt-showdown/RELEASE_NOTES.md
